apis:
- name: Cambio Uruguay API
  description: >-
    REST API for real-time Uruguayan exchange rates: every quote across 40+ houses, per-house
    and per-currency drill-down, historical evolution with statistics, branch locations and
    geocoding, BCU reference rates, and market/economic indicators. 54 operations, all
    anonymous; errors return a validation envelope that lists valid values for retry.
