name: Cambio Uruguay
description: >-
  Uruguayan currency exchange-rate comparison API covering 40+ casas de cambio and banks,
  refreshed roughly every 10 minutes from Banco Central del Uruguay-registered sources.
  Public keyless JSON — no registration, no API key — with current buy/sell quotes, best-house
  comparison, six-month historical series, branch locations with geocoding, BCU reference
  rates, and economic indicators, plus a hosted anonymous Streamable HTTP MCP server and an
  npx-runnable stdio package for AI agents. Open source (MIT) by Eduardo Airaudo.
image: https://cambio-uruguay.com/__og-image__/image/og.png
url: https://raw.githubusercontent.com/api-evangelist/cambio-uruguay/refs/heads/main/apis.yml
