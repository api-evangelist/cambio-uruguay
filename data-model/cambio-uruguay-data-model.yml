id_conventions:
  origin: snake_case slug of the exchange house (e.g. brou, cambio_argentino, la_favorita)
  code: ISO 4217 currency code, plus XAU for gold
  type: quote channel qualifier (BILLETE, CABLE, TRANSFERENCIA, eBROU, INTERBANCARIO); empty string for the default quote
