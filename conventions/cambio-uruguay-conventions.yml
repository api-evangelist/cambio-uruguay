idempotency:
  coverage: na
  documented: false
  header: null
  notes: >-
    Every documented data operation is a GET. POST /ai/insights and POST /geocoding are
    pure computations over supplied input and POST /cache/flush is an operational cache
    reset — no operation creates, updates, or deletes a stored resource, so there is no
    write to protect from replay. Recorded as na, not none: the denominator, not a zero.
reversibility:
