summary: >-
  Cross-cutting semantics for a keyless, read-only public JSON API. No auth, no pagination
  (list endpoints return complete arrays), no versioned URL scheme, plain {error} envelope
  with a rich 400 validation shape. Effectively no persistent write surface: the three POSTs
  (/ai/insights, /geocoding, /cache/flush) are computational or operational, none creates or
  mutates a stored resource, so idempotency and reversibility are honestly not-applicable
  rather than missing.
authentication:
  style: none
  see: authentication/cambio-uruguay-authentication.yml
pagination:
  style: none
  notes: >-
    Rates, locations and parameters endpoints return the full result set in one array.
    Historical endpoints scope by path (origin/code) and query period rather than paging.
versioning:
  scheme: none
  notes: >-
    No version segment in URLs and no versioning policy published; info.version is 1.0.0.
    See lifecycle/cambio-uruguay-lifecycle.yml.
error_envelope:
